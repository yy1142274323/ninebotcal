name: build-ipa

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project NinebotCal.xcodeproj \
            -scheme NinebotCal \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            ENABLE_USER_SCRIPT_SANDBOXING=NO \
            clean build 2>&1 | tail -n 80

      - name: Package IPA (plain)
        run: |
          set -e
          APP=build/Build/Products/Release-iphoneos/NinebotCal.app
          rm -rf Payload
          mkdir -p Payload
          cp -R "$APP" Payload/
          codesign --force --sign - Payload/NinebotCal.app || echo "plain codesign skipped"
          zip -qry NinebotCal-plain.ipa Payload
          rm -rf Payload
          echo "plain done"

      - name: Package IPA (entitled)
        run: |
          set -e
          APP=build/Build/Products/Release-iphoneos/NinebotCal.app
          mkdir -p Payload
          cp -R "$APP" Payload/
          codesign --force --sign - --entitlements NinebotCal/NinebotCal.entitlements Payload/NinebotCal.app || echo "entitled codesign skipped"
          zip -qry NinebotCal.ipa Payload
          echo "--- contents:"
          unzip -l NinebotCal.ipa
          unzip -l NinebotCal-plain.ipa
          ls -lh *.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: NinebotCal-ipa
          path: |
            NinebotCal.ipa
            NinebotCal-plain.ipa
          if-no-files-found: error
